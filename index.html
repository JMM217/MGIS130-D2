<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Interest & Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Dark Mode Switcher -->
        <header class="app-header">
            <div class="header-content">
                <h1>Financial Calculator</h1>
                <p>Interactive Planning Tool for Loans & Interest Growth</p>
            </div>
            
            <button type="button" id="themeToggleBtn" class="theme-toggle">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">Dark Mode</span>
            </button>
        </header>

        <!-- Mode Navigation Tabs -->
        <nav class="calculator-tabs" role="tablist">
            <button type="button" class="tab-btn active" data-mode="amortized">Loan Payment</button>
            <button type="button" class="tab-btn" data-mode="simple">Simple Interest</button>
            <button type="button" class="tab-btn" data-mode="compound">Compound Interest</button>
            <button type="button" class="tab-btn" data-mode="compare">Compare All 3</button>
        </nav>

        <!-- Main Content Layout -->
        <main class="calculator-grid">
            <!-- Data Layer (Inputs) -->
            <section class="card input-section">
                <h2 id="formTitle">Loan Amortization Parameters</h2>
                
                <form id="calculatorForm" class="loan-form" novalidate>
                    <div class="form-group" id="groupPrincipal">
                        <label for="principalInput" id="labelPrincipal">Loan Amount / Principal ($)</label>
                        <input type="number" id="principalInput" placeholder="e.g., 25000" min="0.01" step="any" required>
                    </div>

                    <div class="form-group" id="groupRate">
                        <label for="rateInput">Annual Interest Rate (%)</label>
                        <input type="number" id="rateInput" placeholder="e.g., 6.5" min="0.01" step="any" required>
                    </div>

                    <div class="form-group" id="groupTerm">
                        <label for="termInput">Term (Years)</label>
                        <input type="number" id="termInput" placeholder="e.g., 5" min="1" step="any" required>
                    </div>

                    <div class="form-group hidden" id="groupCompoundFreq">
                        <label for="compoundFreq">Compounding Frequency</label>
                        <select id="compoundFreq">
                            <option value="12" selected>Monthly (12x/yr)</option>
                            <option value="4">Quarterly (4x/yr)</option>
                            <option value="1">Annually (1x/yr)</option>
                            <option value="365">Daily (365x/yr)</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Calculate</button>
                        <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
                    </div>
                </form>

                <div id="errorMessage" class="error-banner hidden" role="alert"></div>
            </section>

            <!-- User Interface Layer (Results Display) -->
            <section class="card results-section">
                <h2>Calculation Results</h2>

                <!-- Default Empty State -->
                <div id="emptyState" class="empty-state">
                    <p>Enter your financial parameters and click <strong>Calculate</strong> to
