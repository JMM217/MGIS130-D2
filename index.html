<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Calculator - Dark Mode Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header with Dark Mode Switcher -->
        <header class="app-header">
            <h1>Financial Calculator</h1>
            
            <button type="button" id="themeToggleBtn" class="theme-toggle">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">Dark Mode</span>
            </button>
        </header>

        <main class="card">
            <h2>Dark Mode Test Card</h2>
            <p>Click the button above to test switching between Light Mode and Dark Mode.</p>
        </main>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
